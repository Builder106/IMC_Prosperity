name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Python dependency audit
        # PYSEC-2026-311 (chromadb, pre-auth code injection): no fix version
        # exists upstream. The vulnerable path requires trust_remote_code=True
        # on the collections API, which this codebase never sets — confirmed
        # via `grep -r trust_remote_code`. Ignored, not exploitable here.
        run: uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2026-311

      - name: Lint (critical errors only)
        # Syntax errors and undefined names in maintained source — not style
        # nitpicks, and not the scraped code snippets under data/.
        run: uv run --frozen ruff check --select E9,F63,F7,F82 src app.py tests

      - name: Run tests
        run: uv run --frozen pytest
