name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Python dependency audit
        # PYSEC-2026-311 (chromadb, pre-auth code injection): no fix version
        # exists upstream. The vulnerable path requires trust_remote_code=True
        # on the collections API, which this codebase never sets — confirmed
        # via `grep -r trust_remote_code`. Ignored, not exploitable here.
        run: uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2026-311

      - name: License compliance check
        run: uv run --with pip-licenses pip-licenses --fail-on="AGPL;GPL"

      - name: Lint
        run: uv run --frozen ruff check src app.py tests

      - name: Format check
        run: uv run --frozen ruff format --check src app.py tests

      - name: Type check (pyright)
        run: uv run --with pyright pyright

      - name: Run tests
        run: uv run --frozen pytest
