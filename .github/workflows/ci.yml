name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache Hugging Face
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Python dependency audit
        # Temporary exception: GitHub reports no patched ChromaDB release. Chroma
        # runs in-process here; the app does not expose a Chroma HTTP server or
        # accept user-controlled collection or model configuration. Revisit this
        # exception when a patched release is available.
        run: >-
          uv run --with pip-audit pip-audit
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833

      - name: License compliance check
        run: uv run --with pip-licenses pip-licenses --fail-on="AGPL;GPL"

      - name: Lint
        run: uv run --frozen ruff check src app.py tests

      - name: Format check
        run: uv run --frozen ruff format --check src app.py tests

      - name: Type check (pyright)
        run: uv run --with pyright pyright

      - name: Run tests
        run: uv run --frozen pytest
