name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint (critical errors only)
        # Syntax errors and undefined names in maintained source — not style
        # nitpicks, and not the scraped code snippets under data/.
        run: uv run --frozen ruff check --select E9,F63,F7,F82 src app.py tests

      - name: Run tests
        run: uv run --frozen pytest
