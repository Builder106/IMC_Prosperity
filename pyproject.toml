[project]
name = "imc-prosperity"
version = "0.1.0"
description = "IMC Prosperity algorithmic trading framework, backtester, and LLM visualizer dashboard."
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "langchain==1.3.9",
    "langchain-core==1.4.7",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "langchain-classic==1.0.8",
    "langchain-huggingface==1.2.2",
    "langchain-chroma==1.1.0",
    "chromadb",
    "protobuf<7",
    "opentelemetry-api==1.41.0",
    "opentelemetry-sdk==1.41.0",
    "opentelemetry-proto==1.41.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.41.0",
    "pysqlite3-binary; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "groq",
    "python-dotenv",
    "pandas",
    "numpy",
    "sentence-transformers",
    "beautifulsoup4",
    "jsonpickle",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "playwright",
    "ruff",
]

[tool.uv]
package = false
default-groups = []

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tools", ".venv", "vectordb", "data", "backtests"]

