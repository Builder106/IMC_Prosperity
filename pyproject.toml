[project]
name = "imc-prosperity"
version = "0.1.0"
description = "IMC Prosperity algorithmic trading framework, backtester, and LLM visualizer dashboard."
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "langchain==1.3.9",
    "langchain-core==1.4.7",
    "langchain-text-splitters==1.1.2",
    "langchain-classic==1.0.8",
    "langchain-huggingface==1.2.2",
    "langchain-chroma==1.1.0",
    "chromadb",
    "protobuf<7",
    "opentelemetry-api==1.41.0",
    "opentelemetry-sdk==1.41.0",
    "opentelemetry-proto==1.41.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.41.0",
    "pysqlite3-binary; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "groq",
    "python-dotenv",
    "pandas",
    "numpy",
    "sentence-transformers",
    "beautifulsoup4",
    "jsonpickle",
    "scipy",
    "gitpython>=3.1.58",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "playwright",
    "ruff",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tools", ".venv", "vectordb", "data", "backtests"]
addopts = "--cov --cov-report=term-missing"
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = [
    "src.rag.model_config",
    "src.rag.discord_data",
    "src.utils.dir_structure",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
src = ["src", "app.py", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PLE",  # flake8-pyi
    "PLR",  # pylint refactoring
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
]
ignore = [
    "BLE001",     # Allow broad exception handling in CLI scripts
    "PLR1722",    # Allow exit() in CLI scripts
    "E501",       # Line too long - we use 100, some existing lines exceed
    "N803",       # Argument names in external API (IMC datamodel)
    "N802",       # Function names in external API
    "N801",       # Class names in external API
    "PLR0913",    # Too many arguments - external API
    "PLR0917",    # Too many positional arguments - external API
    "PLR0912",    # Too many branches - complex trading logic
    "PLR0915",    # Too many statements - complex trading logic
    "N806",       # Variable naming in external API
    "PLR2004",    # Magic values - thresholds in trading algorithms
    "SIM105",     # contextlib.suppress - explicit is clearer
    "E713",       # not in - explicit is clearer
    "RUF100",     # Unused noqa - BLE001 is ignored
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/algorithms/round_*/**/*.py" = ["N801", "N802", "N803", "PLR0913", "PLR0917"]
"src/algorithms/round_2/scripts/datamodel.py" = ["N801", "N802", "N803", "PLR0913", "PLR0917"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
